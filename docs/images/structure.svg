<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Arial, sans-serif" font-size="13">

  <!-- Module: core -->
  <rect x="30" y="30" width="380" height="430" rx="8" ry="8" fill="#f0f4f8" stroke="#4a6fa5" stroke-width="2"/>
  <text x="220" y="58" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a6fa5">Модуль core</text>

  <!-- BookAVLTree -->
  <rect x="60" y="75" width="320" height="80" rx="5" ry="5" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="220" y="98" text-anchor="middle" font-weight="bold" fill="#222">BookAVLTree</text>
  <line x1="60" y1="108" x2="380" y2="108" stroke="#4a6fa5" stroke-width="1"/>
  <text x="80" y="125" fill="#444">+ insert(book: Book)</text>
  <text x="80" y="141" fill="#444">+ delete(cipher: BookCipher)</text>

  <!-- ReaderHashTable -->
  <rect x="60" y="175" width="320" height="80" rx="5" ry="5" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="220" y="198" text-anchor="middle" font-weight="bold" fill="#222">ReaderHashTable</text>
  <line x1="60" y1="208" x2="380" y2="208" stroke="#4a6fa5" stroke-width="1"/>
  <text x="80" y="225" fill="#444">+ put(reader: Reader)</text>
  <text x="80" y="241" fill="#444">+ findByTicket(ticket: ReaderTicket)</text>

  <!-- LoanSkipList -->
  <rect x="60" y="275" width="320" height="80" rx="5" ry="5" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="220" y="298" text-anchor="middle" font-weight="bold" fill="#222">LoanSkipList</text>
  <line x1="60" y1="308" x2="380" y2="308" stroke="#4a6fa5" stroke-width="1"/>
  <text x="80" y="325" fill="#444">+ insert(loan: Loan)</text>
  <text x="80" y="341" fill="#444">+ findByBookCipher(cipher: BookCipher)</text>

  <!-- BoyerMoore -->
  <rect x="60" y="375" width="320" height="60" rx="5" ry="5" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="220" y="398" text-anchor="middle" font-weight="bold" fill="#222">BoyerMoore</text>
  <line x1="60" y1="408" x2="380" y2="408" stroke="#4a6fa5" stroke-width="1"/>
  <text x="80" y="425" fill="#444">+ contains(text: String, pattern: String)</text>

  <!-- Module: app -->
  <rect x="490" y="30" width="380" height="430" rx="8" ry="8" fill="#f0f8f0" stroke="#4a8f5a" stroke-width="2"/>
  <text x="680" y="58" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a8f5a">Модуль app</text>

  <!-- Repositories -->
  <rect x="520" y="75" width="320" height="110" rx="5" ry="5" fill="#ffffff" stroke="#4a8f5a" stroke-width="1.5"/>
  <text x="680" y="98" text-anchor="middle" font-weight="bold" fill="#222">Репозитории</text>
  <line x1="520" y1="108" x2="840" y2="108" stroke="#4a8f5a" stroke-width="1"/>
  <text x="540" y="125" fill="#444">AVLBooksRepository</text>
  <text x="540" y="143" fill="#444">MapReadersRepository</text>
  <text x="540" y="161" fill="#444">SkipListLoansRepository</text>

  <!-- ViewModels -->
  <rect x="520" y="205" width="320" height="110" rx="5" ry="5" fill="#ffffff" stroke="#4a8f5a" stroke-width="1.5"/>
  <text x="680" y="228" text-anchor="middle" font-weight="bold" fill="#222">ViewModel</text>
  <line x1="520" y1="238" x2="840" y2="238" stroke="#4a8f5a" stroke-width="1"/>
  <text x="540" y="255" fill="#444">BooksViewModel</text>
  <text x="540" y="273" fill="#444">ReadersViewModel</text>
  <text x="540" y="291" fill="#444">LoansViewModel</text>

  <!-- UI Screens -->
  <rect x="520" y="335" width="320" height="100" rx="5" ry="5" fill="#ffffff" stroke="#4a8f5a" stroke-width="1.5"/>
  <text x="680" y="358" text-anchor="middle" font-weight="bold" fill="#222">Экраны (UI)</text>
  <line x1="520" y1="368" x2="840" y2="368" stroke="#4a8f5a" stroke-width="1"/>
  <text x="540" y="385" fill="#444">BooksScreen, ReadersScreen</text>
  <text x="540" y="403" fill="#444">LoansScreen, SettingsScreen</text>

  <!-- Arrow: core -> app -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#888"/>
    </marker>
  </defs>
  <line x1="412" y1="260" x2="478" y2="260" stroke="#888" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="6,3"/>
  <text x="445" y="250" text-anchor="middle" fill="#888" font-size="11">использует</text>

</svg>
